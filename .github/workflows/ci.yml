name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build Linux releases
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA:0:12}"
          fi
          go run ./cmd/release -version "$version"
          test "$(dist/deepai-connect-linux-amd64 version)" = "$version"
          dist/deepai-connect-linux-amd64 --help
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Upload Linux binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepai-connect-linux
          path: |
            dist/deepai-connect-linux-amd64
            dist/deepai-connect-linux-arm64
            dist/SHA256SUMS
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14

  release:
    # Only new tags publish; pull requests and manual builds cannot publish.
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deepai-connect-linux
          path: dist
      - name: Verify release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          jq -e --arg version "$RELEASE_TAG" '.version == $version' manifest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          if [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease=true
          fi

          # A failed upload leaves a draft that a rerun can finish. Never
          # replace assets of an already published release.
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes --prerelease="$prerelease" \
              --notes "Download the Linux binary matching your VPS architecture and verify it with SHA256SUMS. See https://github.com/$GH_REPO/blob/$RELEASE_TAG/README.md#install for installation commands."
          fi

          gh release upload "$RELEASE_TAG" --clobber \
            dist/deepai-connect-linux-amd64 dist/deepai-connect-linux-arm64 \
            dist/SHA256SUMS dist/manifest.json

          options=(--draft=false --prerelease="$prerelease" --verify-tag)
          if [[ "$prerelease" == true ]]; then
            options+=(--latest=false)
          fi
          gh release edit "$RELEASE_TAG" "${options[@]}"
